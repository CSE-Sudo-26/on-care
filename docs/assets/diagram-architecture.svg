  <!-- ===================== CI / CD ===================== -->
  <rect x="40" y="900" width="1200" height="62" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="58" y="925" class="band">CI / CD</text>
  <text x="140" y="924" class="card-xs">GitHub Actions — PR Gate · Backend CI(pytest · ruff) · User App CI · Trainer CI · E2E CI</text>
  <text x="140" y="946" class="card-xs">main push ▸ Flutter web 빌드 → GitHub Pages(/frontend · /trainer)   ·   Docker 이미지 → ECR(digest 고정) → App Runner 갱신   ·   S3 + CloudFront 이전 준비(플래그로 게이트)</text>
