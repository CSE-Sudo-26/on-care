  <rect x="585" y="564" width="164" height="112" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#soft)"/>
  <text x="601" y="588" class="card-t2">트레이너 코칭</text>
  <text x="601" y="610" class="card-xs">주간 리포트 요약</text>
  <text x="601" y="628" class="card-xs">프로그램 템플릿</text>
  <text x="601" y="646" class="card-xs">회원 초대 · 배정</text>
