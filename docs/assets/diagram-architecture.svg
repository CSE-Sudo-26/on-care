  <rect x="972" y="88" width="268" height="796" rx="14" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.4"/>
  <text x="990" y="110" class="band">EXTERNAL</text>

  <rect x="990" y="122" width="232" height="104" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5" filter="url(#soft)"/>
