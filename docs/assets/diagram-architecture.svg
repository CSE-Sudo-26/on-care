  <text x="78" y="844" class="card-xs">34개 테이블 · SQLAlchemy ORM · 공용 엔드포인트 + TLS</text>
  <text x="78" y="860" class="card-xs">Alembic 마이그레이션 — advisory lock 으로 직렬 실행</text>

  <rect x="492" y="800" width="204" height="68" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#soft)"/>
  <text x="510" y="824" class="card-t2">벡터 · 참조 데이터</text>
  <text x="510" y="844" class="card-xs">coach_documents (768차원)</text>
  <text x="510" y="860" class="card-xs">food_nutrients 프로세스 캐시</text>

  <rect x="710" y="800" width="216" height="68" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#soft)"/>
  <text x="728" y="824" class="card-t2">파일 저장소</text>
  <text x="728" y="844" class="card-xs">주간 리포트 PDF · 채팅 이미지</text>
  <text x="728" y="860" class="card-xs">본문은 볼륨, 메타데이터는 DB</text>

