  <text x="78" y="517" class="card-xs">notifications · member_coach</text>

  <rect x="352" y="436" width="280" height="94" rx="10" fill="#ffffff" stroke="#dbeafe" stroke-width="1.5" filter="url(#soft)"/>
  <text x="370" y="460" class="card-t2">트레이너 도메인</text>
  <text x="370" y="481" class="card-xs">trainer · trainers</text>
