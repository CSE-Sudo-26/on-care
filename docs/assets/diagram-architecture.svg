  <text x="776" y="646" class="card-xs">리프레시 토큰 폐기</text>
  <text x="776" y="664" class="card-xs">호출 한도 · 비용 가드</text>

  <!-- pluggable engines -->
  <rect x="60" y="690" width="864" height="48" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.3"/>
  <text x="492" y="710" text-anchor="middle" class="eng-b">교체 가능한 AI 엔진 — 팩토리로 주입, 키가 없으면 오프라인 폴백</text>
  <text x="492" y="729" text-anchor="middle" class="eng">인식: Gemini Vision · Claude(LiteLLM) · YOLO · Stub   │   임베딩: Gemini 768 · OpenAI · Hash   │   코치 LLM: Gemini · OpenAI · LiteLLM</text>

  <line x1="300" y1="756" x2="300" y2="768" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar-slate)"/>
  <line x1="684" y1="756" x2="684" y2="768" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar-slate)"/>

  <!-- ===================== DATA ===================== -->
  <rect x="40" y="770" width="904" height="114" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="58" y="792" class="band">DATA</text>

