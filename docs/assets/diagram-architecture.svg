<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 980" width="1280" height="980">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    .title   { font-size: 25px; font-weight: 700; fill: #0f172a; }
    .subtitle{ font-size: 13px; fill: #64748b; }
    .band    { font-size: 11px; font-weight: 700; fill: #94a3b8; letter-spacing: 1.6px; }
    .zone    { font-size: 14.5px; font-weight: 700; fill: #1e3a8a; }
    .zone-s  { font-size: 11px; fill: #64748b; }
    .card-t  { font-size: 14.5px; font-weight: 700; fill: #111827; }
    .card-t2 { font-size: 12.5px; font-weight: 700; fill: #111827; }
    .card-s  { font-size: 11.5px; fill: #64748b; }
    .card-xs { font-size: 10.5px; fill: #64748b; }
    .mid     { font-size: 11px; fill: #1d4ed8; }
    .mid-b   { font-size: 11px; font-weight: 700; fill: #1d4ed8; }
    .eng     { font-size: 10.5px; fill: #6b21a8; }
    .eng-b   { font-size: 11.5px; font-weight: 700; fill: #6b21a8; }
    .note    { font-size: 11px; fill: #94a3b8; }
    .flow    { font-size: 10.5px; font-weight: 700; fill: #2563eb; }
  </style>
  <defs>
    <marker id="ar-blue" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="ar-slate" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="ar-purple" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#9333ea"/></marker>
    <marker id="ar-green" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#16a34a"/></marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="124%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.4" flood-color="#0f172a" flood-opacity="0.09"/></filter>
  </defs>

  <rect width="1280" height="980" fill="#ffffff"/>

  <text x="640" y="42" text-anchor="middle" class="title">System Architecture</text>
  <text x="640" y="66" text-anchor="middle" class="subtitle">회원 앱 · 트레이너 웹 (Flutter)  →  FastAPI  →  PostgreSQL + pgvector  ·  교체 가능한 AI 엔진</text>

  <!-- ===================== CLIENT ===================== -->
  <rect x="40" y="88" width="904" height="150" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="58" y="110" class="band">CLIENT</text>
  <text x="926" y="110" text-anchor="end" class="note">shared/demo_fixture — 두 앱과 백엔드가 같은 데모 데이터를 공유</text>

  <rect x="58" y="120" width="420" height="102" rx="10" fill="#eaf7fd" stroke="#6cc4e6" stroke-width="1.6" filter="url(#soft)"/>
  <text x="78" y="148" class="card-t">회원 앱 <tspan class="card-s">Member</tspan></text>
  <text x="78" y="172" class="card-s">Flutter · iOS / Android / Web · GoRouter · Riverpod</text>
  <text x="78" y="192" class="card-s">Dio + 인증/로깅 인터셉터 · Drift(SQLite) 캐시</text>
  <text x="78" y="211" class="card-xs">토큰은 Secure Storage(Keychain / Keystore)</text>

  <rect x="502" y="120" width="424" height="102" rx="10" fill="#e7f0f8" stroke="#4b8fbc" stroke-width="1.6" filter="url(#soft)"/>
  <text x="522" y="148" class="card-t">트레이너 웹 <tspan class="card-s">Trainer</tspan></text>
  <text x="522" y="172" class="card-s">Flutter Web · 같은 스택을 미러링(코드는 분리)</text>
  <text x="522" y="192" class="card-s">주간 리포트 A4 PDF 생성 · 채팅 사진 첨부</text>
  <text x="522" y="211" class="card-xs">회원 기록을 정리된 리포트 위에서 코칭</text>

  <!-- ===================== TRANSPORT ===================== -->
  <rect x="40" y="256" width="248" height="58" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="60" y="280" class="card-t2">GitHub Pages · 정적 호스팅</text>
  <text x="60" y="300" class="card-xs">ewhasudo.zapto.org · /frontend · /trainer</text>

  <rect x="316" y="256" width="352" height="58" rx="29" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#soft)"/>
  <text x="492" y="280" text-anchor="middle" class="card-t2">HTTPS · JSON REST  ·  /v1</text>
  <text x="492" y="300" text-anchor="middle" class="card-xs">Bearer JWT — access 24h / refresh 30일 회전</text>

  <rect x="696" y="256" width="248" height="58" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="716" y="280" class="card-t2">폴링 스트림</text>
  <text x="716" y="300" class="card-xs">알림 · 코치 메시지를 주기 갱신</text>

  <line x1="164" y1="254" x2="164" y2="240" stroke="#16a34a" stroke-width="1.8" marker-end="url(#ar-green)"/>
  <text x="176" y="248" class="note">배포</text>
  <line x1="492" y1="240" x2="492" y2="252" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar-blue)"/>
  <line x1="492" y1="316" x2="492" y2="330" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar-blue)"/>

  <!-- ===================== BACKEND ===================== -->
  <rect x="40" y="334" width="904" height="420" rx="14" fill="#fbfdff" stroke="#bfdbfe" stroke-width="1.8"/>
  <text x="60" y="360" class="zone">BACKEND — FastAPI (Python 3.12 · SQLAlchemy)</text>
  <text x="924" y="360" text-anchor="end" class="zone-s">AWS App Runner · 컨테이너 :8000 · /v1/healthz</text>

  <!-- middleware -->
  <rect x="60" y="374" width="864" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.3"/>
  <text x="492" y="398" text-anchor="middle" class="mid"><tspan class="mid-b">요청 파이프라인 ▸ </tspan>Request-ID · 액세스 로그  │  보안 헤더 · HSTS  │  CORS  │  업로드 본문 상한  │  Rate Limit  │  JWT 인증 · 토큰 폐기 검사</text>

