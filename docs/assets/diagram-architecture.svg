  <rect x="760" y="564" width="164" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#soft)"/>
  <text x="776" y="588" class="card-t2">알림 · 감사</text>
  <text x="776" y="610" class="card-xs">알림 생성 · 설정</text>
