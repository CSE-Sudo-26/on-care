name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      # 김민수 데모 픽스처는 세 곳이 함께 읽는다 — 이것만 바뀌어도 돌아야 한다(#757).
      - "shared/demo_fixture/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      # 김민수 데모 픽스처는 세 곳이 함께 읽는다 — 이것만 바뀌어도 돌아야 한다(#757).
      - "shared/demo_fixture/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    name: Alembic + Pytest (Postgres/pgvector)
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: oncare
          POSTGRES_PASSWORD: oncare
          POSTGRES_DB: oncare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oncare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENV: dev
      DATABASE_URL: postgresql+psycopg://oncare:oncare@localhost:5432/oncare
      # AI 키는 필요 없음(테스트는 인식/코치 호출을 하지 않음)
      SEED_DEMO_DATA: "true"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Assert single Alembic head (no branched migrations)
        run: |
          set -euo pipefail
          # alembic 실행 자체가 실패하면(분기/설정 오류 등) set -e 로 여기서 즉시 실패시킨다.
          # (이전엔 `alembic heads | grep -c … || true` 라 alembic 실패도 head=... 로 넘어가는
          #  fail-open 이었다.) 성공한 출력에서만 head 개수를 센다.
          alembic heads > alembic_heads.txt
          HEADS=$(grep -c '(head)' alembic_heads.txt || true)
          echo "alembic heads count: $HEADS"
          cat alembic_heads.txt
          if [ "$HEADS" -ne 1 ]; then
            echo "::error::Alembic 마이그레이션 head 가 1개가 아닙니다($HEADS). down_revision 선형화 필요."
            exit 1
          fi

      - name: Run migrations (validates baseline)
        run: alembic upgrade head

      - name: Run tests
        run: pytest
